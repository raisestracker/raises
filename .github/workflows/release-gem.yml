name: Release gem

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gem/Gemfile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: gem
      - uses: rubygems/release-gem@v1
        with:
          working-directory: gem
