services:
  raises:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_PATH: /data/raises.db
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-raises}
      INITIAL_OWNER_GITHUB_ID: ${INITIAL_OWNER_GITHUB_ID:-0}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      REPORT_ENABLED: ${REPORT_ENABLED:-0}
      OPERATIONAL_ALERTS_ENABLED: ${OPERATIONAL_ALERTS_ENABLED:-0}
      REPORT_EMAIL_FROM: ${REPORT_EMAIL_FROM:-}
      REPORT_EMAIL_TO: ${REPORT_EMAIL_TO:-}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-UTC}
      REPORT_SEND_AT: ${REPORT_SEND_AT:-07:00}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      NTFY_ENABLED: ${NTFY_ENABLED:-0}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - raises_data:/data

volumes:
  raises_data:
